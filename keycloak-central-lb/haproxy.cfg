# Load balancer in front of the central Keycloak nodes. It owns the
# "keycloak-central" name on edge-net, so nginx reaches it without knowing how
# many nodes there are.
#   :8080  Keycloak HTTP (behind nginx, which sets the X-Forwarded-* headers)
#   :8404  stats page
# The nodes share sessions through Infinispan, so affinity is only an
# optimisation: it keeps a login flow on the node that owns AUTH_SESSION_ID
# and saves cross-node lookups.
global
    log stdout format raw local0

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 10s

defaults
    mode http
    log global
    option httplog
    # Only connection failures are retried (HAProxy's default retry-on), so a
    # POST that reached a node is never sent twice.
    option redispatch
    retries 2
    timeout connect 2s
    timeout client 60s
    timeout server 60s
    timeout check 3s

listen stats
    bind :8404
    stats enable
    stats uri /
    stats refresh 5s

frontend keycloak
    bind :8080
    default_backend keycloak_nodes

backend keycloak_nodes
    # Same as nginx did before: consistent hash on the auth session cookie.
    # Requests without the cookie fall back to round robin.
    balance hash req.cook(AUTH_SESSION_ID)
    hash-type consistent
    # Readiness lives on the management port, not on :8080.
    option httpchk GET /health/ready
    http-check expect status 200
    default-server inter 3s fall 2 rise 2 check port 9000 resolvers docker init-addr last,libc,none
    server keycloak-central-1 keycloak-central-1:8080
    server keycloak-central-2 keycloak-central-2:8080
