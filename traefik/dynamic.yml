http:
  middlewares:
    auth-middleware:
      forwardAuth:
        address: "http://auth-svc:8080/verify" # Points to your Go auth service container/address
        trustForwardHeader: true               # Passes X-Forwarded-* headers (like URI and Host) to your auth-svc
        authResponseHeaders:
          - "X-User-ID"             # Injects this header from your auth-svc's 200 OK response down to the backend

  routers:
    mock-router-public:
      entryPoints: [web]
      rule: "Path(`/`)"
      service: mock@consulcatalog

    mock-router-protected:
      entryPoints: [web]
      rule: "PathPrefix(`/doOperation`)"
      middlewares: [auth-middleware]
      service: mock@consulcatalog
    
    auth-service-router:
      entryPoints: [web]
      rule: "PathPrefix(`/login`)"
      service: "auth@consulcatalog"