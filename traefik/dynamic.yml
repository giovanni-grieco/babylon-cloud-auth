http:
  middlewares:
    auth-middleware:
      forwardAuth:
        address: "http://oauth2-proxy:4180/"
        authResponseHeaders:
          - "X-Auth-Request-User"
          - "X-Auth-Request-Preferred-Username"
          - "X-Auth-Request-Email"
          - "X-Auth-Request-Groups"

  routers:
    mock-router-public:
      entryPoints: [web]
      rule: "Path(`/`)"
      service: mock@consulcatalog

    mock-router-protected:
      entryPoints: [web]
      rule: "PathPrefix(`/doOperation`)"
      middlewares: [auth-middleware]
      service: mock@consulcatalog

    oauth2-router:
      entryPoints: [web]
      rule: "PathPrefix(`/oauth2/`)"
      service: oauth2-proxy

  services:
    oauth2-proxy:
      loadBalancer:
        servers:
          - url: "http://oauth2-proxy:4180"
