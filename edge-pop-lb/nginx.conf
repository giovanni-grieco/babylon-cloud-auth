events {
    worker_connections 1024;
}

http {

    resolver 127.0.0.11 valid=10s ipv6=off;

    # Inherited by every location below
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_connect_timeout 2s;

    # Keycloak and oauth2-proxy send large cookies and redirect URLs
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    upstream gateways {
        zone gateways 64k;
        hash $remote_addr consistent;
        server api-gateway-1:80 resolve max_fails=3 fail_timeout=10s;
        server api-gateway-2:80 resolve max_fails=3 fail_timeout=10s;
    }

    # keycloak-central-lb (HAProxy): picks the node, with AUTH_SESSION_ID affinity
    upstream keycloak {
        zone keycloak 64k;
        server keycloak-central:8080 resolve max_fails=3 fail_timeout=10s;
    }

    upstream keycloak_dc1 {
        zone keycloak_dc1 64k;
        server keycloak-dc-1:8080 resolve max_fails=3 fail_timeout=10s;
    }

    upstream keycloak_dc2 {
        zone keycloak_dc2 64k;
        server keycloak-dc-2:8080 resolve max_fails=3 fail_timeout=10s;
    }

    upstream keycloak_control_plane {
        zone keycloak_control_plane 64k;
        server keycloak-control-plane:8080 resolve max_fails=3 fail_timeout=10s;
    }

    upstream control_plane {
        zone control_plane 64k;
        server control-plane:8080 resolve max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80 default_server;
        server_name babylon.test;

        location / {
            proxy_pass http://gateways;
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        }
    }

    server {
        listen 80;
        server_name auth.babylon.test;

        location / {
            proxy_pass http://keycloak;  # retries between nodes happen in HAProxy
        }
    }

    server {
        listen 80;
        server_name auth.dc-1.babylon.test;

        location / {
            proxy_pass http://keycloak_dc1;
        }
    }

    server {
        listen 80;
        server_name auth.dc-2.babylon.test;

        location / {
            proxy_pass http://keycloak_dc2;
        }
    }

    # Operators' Keycloak (login for the control plane console only)
    server {
        listen 80;
        server_name auth.control-plane.babylon.test;

        location / {
            proxy_pass http://keycloak_control_plane;
        }
    }

    # Operator console. control-plane-lb sends it through oauth2-proxy (login
    # on auth.control-plane.babylon.test); only /api/v1/discover goes straight
    # to the service, which checks the shared secret.
    server {
        listen 80;
        server_name control-plane.babylon.test;

        client_max_body_size 5m;  # the console's upload limit
        proxy_read_timeout 600s;  # a large import makes one Keycloak call per user

        location / {
            proxy_pass http://control_plane;
        }
    }
}
