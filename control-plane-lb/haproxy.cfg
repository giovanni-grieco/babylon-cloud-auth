# Load balancer in front of the control plane replicas. It owns the
# "control-plane" name on edge-net, so nginx (console) and Keycloak (HRD
# oracle) reach it without knowing how many replicas there are.
#   :8080  operator console
#   :8081  REST API (HRD oracle)
#   :8404  stats page
# Replicas share all state through Postgres, so no sticky sessions.
global
    log stdout format raw local0

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 10s

defaults
    mode http
    log global
    option httplog
    option redispatch
    retries 2
    timeout connect 2s
    timeout client 600s
    # A large import makes one Keycloak call per user (nginx allows 600s too).
    timeout server 600s
    timeout check 3s
    # /healthz answers 503 when the replica can't write to the database.
    option httpchk GET /healthz
    http-check expect status 200
    default-server inter 3s fall 2 rise 2 resolvers docker init-addr last,libc,none

listen stats
    bind :8404
    stats enable
    stats uri /
    stats refresh 5s

frontend console
    bind :8080
    default_backend console_replicas

backend console_replicas
    balance roundrobin
    server control-plane-svc-1 control-plane-svc-1:8080 check
    server control-plane-svc-2 control-plane-svc-2:8080 check

frontend rest
    bind :8081
    default_backend rest_replicas

backend rest_replicas
    balance roundrobin
    server control-plane-svc-1 control-plane-svc-1:8081 check
    server control-plane-svc-2 control-plane-svc-2:8081 check
