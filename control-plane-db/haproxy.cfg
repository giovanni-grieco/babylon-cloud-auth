# Entry point to the control plane database cluster. Patroni answers on each
# node's REST API (port 8008) whether that node is the primary or a replica,
# and HAProxy only sends traffic where the answer is 200.
#   :5432  read-write, always the current primary
#   :5433  read-only, the replicas
#   :8404  stats page
global
    log stdout format raw local0
    maxconn 200

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 10s

defaults
    mode tcp
    log global
    timeout connect 4s
    # Long, because the control plane keeps idle connections in its pool.
    timeout client 30m
    timeout server 30m
    timeout check 3s

listen stats
    mode http
    bind :8404
    stats enable
    stats uri /
    stats refresh 5s

listen primary
    bind :5432
    option httpchk
    http-check send meth GET uri /primary
    http-check expect status 200
    # on-marked-down closes connections to a node that stopped being the
    # primary, so clients reconnect and land on the new one.
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions resolvers docker init-addr last,libc,none
    server control-plane-db-1 control-plane-db-1:5432 maxconn 100 check port 8008
    server control-plane-db-2 control-plane-db-2:5432 maxconn 100 check port 8008

listen replicas
    bind :5433
    balance roundrobin
    option httpchk
    http-check send meth GET uri /replica
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions resolvers docker init-addr last,libc,none
    server control-plane-db-1 control-plane-db-1:5432 maxconn 100 check port 8008
    server control-plane-db-2 control-plane-db-2:5432 maxconn 100 check port 8008
