services:
  # 0. LOAD BALANCER (public entrypoint)
  load-balancer:
    image: nginx:alpine
    container_name: load-balancer
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      edge-net:
        aliases:
          # Containers resolve the issuer to nginx, exactly like the browser does,
          # so the token issuer URL is the same on both sides.
          - auth.babylon.test
    depends_on:
      - api-gateway-1
      - api-gateway-2
      - keycloak

  # 1. IDENTITY PROVIDER
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.7
    container_name: keycloak
    command: start-dev --import-realm # lab only; use `start` with HTTPS in production
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?run start.sh or copy .env.example to .env}
      KC_HOSTNAME: http://auth.babylon.test
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USERNAME:?run start.sh or copy .env.example to .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?run start.sh or copy .env.example to .env}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?run start.sh or copy .env.example to .env} # read by the realm import
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
    healthcheck:
      # The image has no curl, so talk to the management port through bash.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - edge-net
      - keycloak-net
    depends_on:
      keycloak-db:
        condition: service_healthy

  keycloak-db:
    image: postgres:17
    container_name: keycloak-db
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:?run start.sh or copy .env.example to .env}
      POSTGRES_DB: keycloak
      TZ: Europe/Rome
    volumes:
      - ./keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - keycloak-net

  # 2. OIDC CLIENT FOR THE GATEWAYS (Traefik's forwardAuth target)
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.12.0
    container_name: oauth2-proxy
    restart: unless-stopped # retries OIDC discovery if the issuer isn't reachable yet
    command:
      - --http-address=0.0.0.0:4180
      - --provider=keycloak-oidc
      - --client-id=gateway
      - --oidc-issuer-url=http://auth.babylon.test/realms/babylon
      - --redirect-url=http://babylon.test/oauth2/callback
      - --code-challenge-method=S256
      - --email-domain=*
      - --insecure-oidc-allow-unverified-email=true # lab only; open registration has no SMTP
      - --skip-provider-button=true
      - --reverse-proxy=true
      - --upstream=static://202 # authenticated: answer forwardAuth without proxying anywhere
      - --set-xauthrequest=true
      - --cookie-domain=.babylon.test
      - --whitelist-domain=.babylon.test
      - --cookie-secure=false # lab only; remove with HTTPS
      - --cookie-refresh=4m # shorter than the 5 minute access token
      - --cookie-expire=10h # matches Keycloak's SSO session max
      - --session-store-type=redis
      - --redis-connection-url=redis://state-kv:6379
    environment:
      OAUTH2_PROXY_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?run start.sh or copy .env.example to .env}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:?run start.sh or copy .env.example to .env}
    networks:
      - edge-net
    depends_on:
      keycloak:
        condition: service_healthy
      load-balancer:
        condition: service_started
      state-kv:
        condition: service_healthy

  # Holds oauth2-proxy sessions, shared by both gateways
  state-kv:
    image: redis:latest
    container_name: state-kv
    volumes:
        - ./state-kv:/data
    environment:
        - REDIS_ARGS=
    ports:
      - "127.0.0.1:6371:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 3
    networks:
      edge-net:
        aliases:
          - state-kv

  # 3. API GATEWAY (one per cluster; duplicate for cluster B later)
  api-gateway-1:
    image: traefik:latest
    container_name: api-gateway-1
    command:
      - --api.insecure=true                     # dashboard + API on :8080 (lab only)
      - --providers.consulcatalog.endpoint.address=consul:8500
      - --providers.consulcatalog.endpoint.scheme=http
      - --providers.consulcatalog.exposedByDefault=false
      - --providers.file.directory=/etc/traefik/dynamic
      - --entrypoints.web.address=:80
    volumes:
      - ./traefik:/etc/traefik/dynamic:ro
    ports:
      - "127.0.0.1:8081:8080"                             # Traefik dashboard
    networks:
      - edge-net
      - cluster-net-1
    depends_on:
      - consul-1

  api-gateway-2:
    image: traefik:latest
    container_name: api-gateway-2
    command:
      - --api.insecure=true                     # dashboard + API on :8080 (lab only)
      - --providers.consulcatalog.endpoint.address=consul:8500
      - --providers.consulcatalog.endpoint.scheme=http
      - --providers.consulcatalog.exposedByDefault=false
      - --providers.file.directory=/etc/traefik/dynamic
      - --entrypoints.web.address=:80
    volumes:
      - ./traefik:/etc/traefik/dynamic:ro
    ports:
      - "127.0.0.1:8082:8080"                             # Traefik dashboard
    networks:
      - edge-net
      - cluster-net-2
    depends_on:
      - consul-2

  # 4. SERVICE REGISTRY (one Consul agent per cluster)
  consul-1:
    image: hashicorp/consul:latest
    container_name: consul-1
    command: agent -server -bootstrap-expect=1 -client=0.0.0.0 -ui -data-dir=/consul/data
    ports:
      - "127.0.0.1:8501:8500"                             # HTTP API + UI
    networks:
      cluster-net-1:
        aliases:
          - consul

  consul-2:
    image: hashicorp/consul:latest
    container_name: consul-2
    command: agent -server -bootstrap-expect=1 -client=0.0.0.0 -ui -data-dir=/consul/data
    ports:
      - "127.0.0.1:8502:8500"                             # HTTP API + UI
    networks:
      cluster-net-2:
        aliases:
          - consul

  # 5. MOCK SERVICE (replicas self-register with Consul at runtime)
  mock-svc-1-1:
    build: ./mock-svc
    container_name: mock-svc-1-1
    volumes:
      - ./mock-svc/templates:/app/templates:ro
    environment:
      - CONSUL_ADDR=consul
    networks:
      - cluster-net-1
    depends_on:
      - consul-1

  mock-svc-1-2:
    build: ./mock-svc
    container_name: mock-svc-1-2
    volumes:
      - ./mock-svc/templates:/app/templates:ro
    environment:
      - CONSUL_ADDR=consul
    networks:
      - cluster-net-1
    depends_on:
      - consul-1

  mock-svc-2-1:
    build: ./mock-svc
    container_name: mock-svc-2-1
    volumes:
      - ./mock-svc/templates:/app/templates:ro
    environment:
      - CONSUL_ADDR=consul
    networks:
      - cluster-net-2
    depends_on:
      - consul-2

  mock-svc-2-2:
    build: ./mock-svc
    container_name: mock-svc-2-2
    volumes:
      - ./mock-svc/templates:/app/templates:ro
    environment:
      - CONSUL_ADDR=consul
    networks:
      - cluster-net-2
    depends_on:
      - consul-2

networks:
  edge-net:
    driver: bridge

  keycloak-net:
    driver: bridge

  cluster-net-1:
    driver: bridge

  cluster-net-2:
    driver: bridge

volumes:
  keycloak-db-data:
