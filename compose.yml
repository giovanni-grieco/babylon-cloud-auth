services:

  # 1. LOAD BALANCER
  load-balancer:
    image: nginx:alpine
    container_name: load-balancer
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - lab-net
    depends_on:
      - mock-svc-1
      - mock-svc-2

  mock-svc-1:
    build: ./mock-svc
    container_name: mock-svc-1
    environment:
      - ID=1
    ports:
      - "8081:8888"
    networks:
      - lab-net
  mock-svc-2:
    build: ./mock-svc
    container_name: mock-svc-2
    environment:
      - ID=2
    ports:
      - "8082:8888"
    networks:
      - lab-net

networks:
  lab-net:
    driver: bridge