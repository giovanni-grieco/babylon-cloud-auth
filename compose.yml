x-keycloak-env: &keycloak-env
  KC_DB: postgres
  KC_DB_USERNAME: keycloak
  KC_PROXY_HEADERS: xforwarded
  KC_HEALTH_ENABLED: "true"

x-keycloak-base: &keycloak-base
  command: start-dev --import-realm # lab only; use `start` with HTTPS in production
  healthcheck:
    # The image has no curl, so talk to the management port through bash.
    test:
      - CMD-SHELL
      - >-
        exec 3<>/dev/tcp/127.0.0.1/9000 &&
        printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
        grep -q '"UP"' <&3
    interval: 7s
    timeout: 10s
    retries: 30
    start_period: 30s

x-keycloak-db-env: &keycloak-db-env
  POSTGRES_USER: keycloak
  POSTGRES_DB: keycloak
  TZ: Europe/Rome

x-keycloak-db-base: &keycloak-db-base
  image: postgres:17
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
    interval: 7s
    timeout: 10s
    retries: 5

x-oauth2-proxy-base: &oauth2-proxy-base
  image: quay.io/oauth2-proxy/oauth2-proxy:v7.12.0
  restart: unless-stopped # retries OIDC discovery if the issuer isn't reachable yet
  command:
    - --http-address=0.0.0.0:4180
    - --provider=keycloak-oidc
    - --client-id=gateway
    - --oidc-issuer-url=http://auth.babylon.test/realms/babylon
    - --redirect-url=http://babylon.test/oauth2/callback
    - --code-challenge-method=S256
    - --email-domain=*
    - --oidc-email-claim=sub # central tokens carry no email, by design
    - --insecure-oidc-allow-unverified-email=true # there's no email_verified claim either
    - --skip-provider-button=true
    - --reverse-proxy=true
    - --upstream=static://202 # authenticated: answer forwardAuth without proxying anywhere
    - --set-xauthrequest=true
    - --cookie-domain=.babylon.test
    - --whitelist-domain=.babylon.test
    - --cookie-secure=false # lab only; remove with HTTPS
    - --cookie-refresh=4m # shorter than the 5 minute access token
    - --cookie-expire=10h # matches Keycloak's SSO session max
    #- --session-store-type=redis
    #- --redis-connection-url=redis://state-kv:6379
  environment:
    OAUTH2_PROXY_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?run start.sh or copy .env.example to .env}
    OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:?run start.sh or copy .env.example to .env}
  depends_on:
    keycloak:
      condition: service_healthy
    #state-kv:
      #condition: service_healthy

x-control-plane-svc-base: &control-plane-svc-base
  build:
    context: .
    dockerfile: ./control-plane-svc/Dockerfile
  # Exits when the database isn't reachable yet (Patroni is still electing a
  # primary) and comes back once it is.
  restart: unless-stopped
  environment:
    ADDRESS:    0.0.0.0
    WEB_PORT:   "8080"
    REST_PORT:  "8081"
    CP_CONFIG: /etc/control-plane/config.json
    CONTROL_PLANE_SECRET: ${CONTROL_PLANE_SECRET:?run start.sh or copy .env.example to .env}
    CENTRAL_CONTROL_PLANE_KEYCLOAK_CLIENT_SECRET: ${CENTRAL_CONTROL_PLANE_KEYCLOAK_CLIENT_SECRET:? run start.sh or copy .env.example to .env}
    DC1_CONTROL_PLANE_KEYCLOAK_CLIENT_SECRET: ${DC1_CONTROL_PLANE_KEYCLOAK_CLIENT_SECRET:?run start.sh or copy .env.example to .env}
    DC2_CONTROL_PLANE_KEYCLOAK_CLIENT_SECRET: ${DC2_CONTROL_PLANE_KEYCLOAK_CLIENT_SECRET:?run start.sh or copy .env.example to .env}
    POSTGRES_HOST: control-plane-db  # control-plane-db-lb, always the primary
    POSTGRES_PORT: 5432
    POSTGRES_USER: control-plane
    POSTGRES_DB: control-plane
    POSTGRES_PASSWORD: ${CONTROL_PLANE_DB_PASSWORD:?run start.sh or copy .env.example to .env}
    POSTGRES_SSL_MODE: disable
    TZ: Europe/Rome
    TIMEZONE: Europe/Rome
  volumes:
    - ./control-plane-svc/config.json:/etc/control-plane/config.json:ro
  networks:
    - edge-net              # reaches every Keycloak through the load balancer, like the browser
    - control-plane-db-net  # reaches the database load balancer
  depends_on:
    control-plane-db-lb:
      condition: service_started
    keycloak:
      condition: service_healthy
    keycloak-dc-1:
      condition: service_healthy
    keycloak-dc-2:
      condition: service_healthy

x-control-plane-etcd-env: &control-plane-etcd-env
  ETCD_DATA_DIR: /etcd-data
  ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
  ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
  ETCD_INITIAL_CLUSTER: control-plane-etcd-1=http://control-plane-etcd-1:2380,control-plane-etcd-2=http://control-plane-etcd-2:2380,control-plane-etcd-3=http://control-plane-etcd-3:2380
  ETCD_INITIAL_CLUSTER_STATE: new
  ETCD_INITIAL_CLUSTER_TOKEN: control-plane-etcd

x-control-plane-etcd-base: &control-plane-etcd-base
  image: quay.io/coreos/etcd:v3.5.21
  command: ["etcd"]
  restart: unless-stopped
  networks:
    - control-plane-db-net

x-control-plane-db-env: &control-plane-db-env
  PATRONI_SUPERUSER_USERNAME: postgres
  PATRONI_SUPERUSER_PASSWORD: ${CONTROL_PLANE_DB_SUPERUSER_PASSWORD:?run start.sh or copy .env.example to .env}
  PATRONI_REPLICATION_USERNAME: replicator
  PATRONI_REPLICATION_PASSWORD: ${CONTROL_PLANE_DB_REPLICATION_PASSWORD:?run start.sh or copy .env.example to .env}
  # Read by post_bootstrap.sh when the cluster is first created
  CONTROL_PLANE_DB_USER: control-plane
  CONTROL_PLANE_DB_NAME: control-plane
  CONTROL_PLANE_DB_PASSWORD: ${CONTROL_PLANE_DB_PASSWORD:?run start.sh or copy .env.example to .env}
  TZ: Europe/Rome

x-control-plane-db-base: &control-plane-db-base
  build: ./control-plane-db
  restart: unless-stopped
  healthcheck:
    # Patroni's /health is 200 while Postgres runs, as primary or replica.
    test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/health', timeout=3)"]
    interval: 7s
    timeout: 5s
    retries: 10
    start_period: 30s
  networks:
    - control-plane-db-net
  depends_on:
    - control-plane-etcd-1
    - control-plane-etcd-2
    - control-plane-etcd-3

services:
  # 0. LOAD BALANCER (public entrypoint)
  load-balancer:
    image: nginx:alpine
    container_name: load-balancer
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      edge-net:
        aliases:
          # Containers resolve the issuer to nginx, exactly like the browser does,
          # so the token issuer URL is the same on both sides.
          - auth.babylon.test
          - auth.dc-1.babylon.test
          - auth.dc-2.babylon.test

  # Catches the central realm's verification and password-reset emails (lab only).
  # Inbox: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31.6
    container_name: mailpit
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - keycloak-net
  # Operator console for provisioning B2B accounts into the DC realms, at
  # http://control-plane.babylon.test. It has no login of its own; nginx only
  # lets this machine reach it.
  #
  # Two replicas behind HAProxy (control-plane-lb). They keep no state of their
  # own: everything is in Postgres, and the reconciler claims rows with
  # SELECT ... FOR UPDATE SKIP LOCKED, so both can run it at once.
  control-plane-svc-1:
    <<: *control-plane-svc-base
    container_name: control-plane-svc-1

  control-plane-svc-2:
    <<: *control-plane-svc-base
    container_name: control-plane-svc-2

  control-plane-lb:
    image: haproxy:3.2-alpine
    container_name: control-plane-lb
    volumes:
      - ./control-plane-lb/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "127.0.0.1:9080:8080"  # console
      - "127.0.0.1:9081:8081"  # REST API
      - "127.0.0.1:8404:8404"  # HAProxy stats
    networks:
      edge-net:
        aliases:
          - control-plane  # nginx and Keycloak's HRD oracle URL point here
    depends_on:
      - control-plane-svc-1
      - control-plane-svc-2

  # Control plane database: two Postgres nodes run by Patroni, one primary and
  # one hot standby in synchronous replication. etcd (three members, so a
  # majority survives one loss) holds the leader lock that decides which node
  # is the primary; with only two voters a network split could elect two.
  control-plane-etcd-1:
    <<: *control-plane-etcd-base
    container_name: control-plane-etcd-1
    environment:
      <<: *control-plane-etcd-env
      ETCD_NAME: control-plane-etcd-1
      ETCD_ADVERTISE_CLIENT_URLS: http://control-plane-etcd-1:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://control-plane-etcd-1:2380
    volumes:
      - control-plane-etcd-1-data:/etcd-data

  control-plane-etcd-2:
    <<: *control-plane-etcd-base
    container_name: control-plane-etcd-2
    environment:
      <<: *control-plane-etcd-env
      ETCD_NAME: control-plane-etcd-2
      ETCD_ADVERTISE_CLIENT_URLS: http://control-plane-etcd-2:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://control-plane-etcd-2:2380
    volumes:
      - control-plane-etcd-2-data:/etcd-data

  control-plane-etcd-3:
    <<: *control-plane-etcd-base
    container_name: control-plane-etcd-3
    environment:
      <<: *control-plane-etcd-env
      ETCD_NAME: control-plane-etcd-3
      ETCD_ADVERTISE_CLIENT_URLS: http://control-plane-etcd-3:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://control-plane-etcd-3:2380
    volumes:
      - control-plane-etcd-3-data:/etcd-data

  control-plane-db-1:
    <<: *control-plane-db-base
    container_name: control-plane-db-1
    environment:
      <<: *control-plane-db-env
      PATRONI_NAME: control-plane-db-1
      PATRONI_RESTAPI_CONNECT_ADDRESS: control-plane-db-1:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: control-plane-db-1:5432
    volumes:
      - control-plane-db-1-data:/var/lib/postgresql/data

  control-plane-db-2:
    <<: *control-plane-db-base
    container_name: control-plane-db-2
    environment:
      <<: *control-plane-db-env
      PATRONI_NAME: control-plane-db-2
      PATRONI_RESTAPI_CONNECT_ADDRESS: control-plane-db-2:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: control-plane-db-2:5432
    volumes:
      - control-plane-db-2-data:/var/lib/postgresql/data

  # Always forwards :5432 to whichever node Patroni says is the primary.
  control-plane-db-lb:
    image: haproxy:3.2-alpine
    container_name: control-plane-db-lb
    volumes:
      - ./control-plane-db/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "5433:5432"            # primary, read-write (lab only; remove with HTTPS)
      - "127.0.0.1:5434:5433"  # replicas, read-only
      - "127.0.0.1:8405:8404"  # HAProxy stats
    networks:
      control-plane-db-net:
        aliases:
          - control-plane-db  # POSTGRES_HOST of the control plane
    depends_on:
      - control-plane-db-1
      - control-plane-db-2

  # 1. CENTRAL IDENTITY BROKER: the single login point. It routes B2B email domains
  #    to the DC Keycloak that owns the user, and stores self-registered B2C users itself.
  keycloak:
    <<: *keycloak-base
    build: ./keycloak/central
    container_name: keycloak
    environment:
      <<: *keycloak-env
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?run start.sh or copy .env.example to .env}
      KC_HOSTNAME: http://auth.babylon.test
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USERNAME:?run start.sh or copy .env.example to .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?run start.sh or copy .env.example to .env}
      # Read by the realm import
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?run start.sh or copy .env.example to .env}
      DC1_BROKER_SECRET: ${DC1_BROKER_SECRET:?run start.sh or copy .env.example to .env}
      DC2_BROKER_SECRET: ${DC2_BROKER_SECRET:?run start.sh or copy .env.example to .env}
      # Home realm discovery oracle (babylon-hrd authenticator). Unset or unreachable:
      # every user falls back to the central (B2C) login.
      CENTRAL_CONTROL_PLANE_KEYCLOAK_CLIENT_SECRET: ${CENTRAL_CONTROL_PLANE_KEYCLOAK_CLIENT_SECRET}
      HRD_ORACLE_URL: http://control-plane:8081/api/v1/discover
      HRD_ORACLE_SECRET: ${CONTROL_PLANE_SECRET:?run start.sh or copy .env.example to .env}
    volumes:
      - ./keycloak/central/import:/opt/keycloak/data/import:ro
    networks:
      - edge-net
      - keycloak-net
    depends_on:
      keycloak-db:
        condition: service_healthy

  keycloak-db:
    <<: *keycloak-db-base
    container_name: keycloak-db
    environment:
      <<: *keycloak-db-env
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:?run start.sh or copy .env.example to .env}
    ports:
      - "5430:5432" # lab only; remove with HTTPS
    volumes:
      - ./keycloak-db-data:/var/lib/postgresql/data
    networks:
      - keycloak-net

  # 1a. DC IDENTITY PROVIDERS: each owns its users, on a database no other DC can reach.
  keycloak-dc-1:
    <<: *keycloak-base
    image: quay.io/keycloak/keycloak:26.7.0
    container_name: keycloak-dc-1
    environment:
      <<: *keycloak-env
      KC_DB_URL: jdbc:postgresql://keycloak-dc-1-db:5432/keycloak
      KC_DB_PASSWORD: ${DC1_DB_PASSWORD:?run start.sh or copy .env.example to .env}
      KC_HOSTNAME: http://auth.dc-1.babylon.test
      KC_BOOTSTRAP_ADMIN_USERNAME: ${DC1_ADMIN_USERNAME:?run start.sh or copy .env.example to .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${DC1_ADMIN_PASSWORD:?run start.sh or copy .env.example to .env}
      # Read by the realm import
      DC1_BROKER_SECRET: ${DC1_BROKER_SECRET:?run start.sh or copy .env.example to .env}
      DC1_CONTROL_PLANE_KEYCLOAK_CLIENT_SECRET: ${DC1_CONTROL_PLANE_KEYCLOAK_CLIENT_SECRET:?run start.sh or copy .env.example to .env}
    volumes:
      - ./keycloak/dc-1/import:/opt/keycloak/data/import:ro
    networks:
      - edge-net
      - keycloak-dc-1-net
    depends_on:
      keycloak-dc-1-db:
        condition: service_healthy

  keycloak-dc-1-db:
    <<: *keycloak-db-base
    container_name: keycloak-dc-1-db
    environment:
      <<: *keycloak-db-env
      POSTGRES_PASSWORD: ${DC1_DB_PASSWORD:?run start.sh or copy .env.example to .env}
    ports:
      - "5431:5432" # lab only; remove with HTTPS
    volumes:
      - ./keycloak-dc-1-db-data:/var/lib/postgresql/data
    networks:
      - keycloak-dc-1-net

  keycloak-dc-2:
    <<: *keycloak-base
    image: quay.io/keycloak/keycloak:26.7.0
    container_name: keycloak-dc-2
    environment:
      <<: *keycloak-env
      KC_DB_URL: jdbc:postgresql://keycloak-dc-2-db:5432/keycloak
      KC_DB_PASSWORD: ${DC2_DB_PASSWORD:?run start.sh or copy .env.example to .env}
      KC_HOSTNAME: http://auth.dc-2.babylon.test
      KC_BOOTSTRAP_ADMIN_USERNAME: ${DC2_ADMIN_USERNAME:?run start.sh or copy .env.example to .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${DC2_ADMIN_PASSWORD:?run start.sh or copy .env.example to .env}
      # Read by the realm import
      DC2_BROKER_SECRET: ${DC2_BROKER_SECRET:?run start.sh or copy .env.example to .env}
      DC2_CONTROL_PLANE_KEYCLOAK_CLIENT_SECRET: ${DC2_CONTROL_PLANE_KEYCLOAK_CLIENT_SECRET:?run start.sh or copy .env.example to .env}
    volumes:
      - ./keycloak/dc-2/import:/opt/keycloak/data/import:ro
    networks:
      - edge-net
      - keycloak-dc-2-net
    depends_on:
      keycloak-dc-2-db:
        condition: service_healthy

  keycloak-dc-2-db:
    <<: *keycloak-db-base
    container_name: keycloak-dc-2-db
    environment:
      <<: *keycloak-db-env
      POSTGRES_PASSWORD: ${DC2_DB_PASSWORD:?run start.sh or copy .env.example to .env}
    ports:
      - "5432:5432" # lab only; remove with HTTPS
    volumes:
      - ./keycloak-dc-2-db-data:/var/lib/postgresql/data
    networks:
      - keycloak-dc-2-net

  # 2. OIDC CLIENT, ONE PER GATEWAY (Traefik's forwardAuth target)
  #    The oauth2-proxy alias exists only on the cluster network, so each gateway
  #    reaches its own instance. Don't add it to edge-net, where both gateways would see both.
  oauth2-proxy-1:
    <<: *oauth2-proxy-base
    container_name: oauth2-proxy-1
    networks:
      edge-net: # reaches Keycloak and Redis
      cluster-net-1:
        aliases:
          - oauth2-proxy

  oauth2-proxy-2:
    <<: *oauth2-proxy-base
    container_name: oauth2-proxy-2
    networks:
      edge-net: # reaches Keycloak and Redis
      cluster-net-2:
        aliases:
          - oauth2-proxy

  # 3. API GATEWAY (one per cluster; duplicate for cluster B later)
  api-gateway-1:
    image: traefik:latest
    container_name: api-gateway-1
    command:
      - --api.insecure=true                     # dashboard + API on :8080 (lab only)
      - --providers.consulcatalog.endpoint.address=consul:8500
      - --providers.consulcatalog.endpoint.scheme=http
      - --providers.consulcatalog.exposedByDefault=false
      - --providers.file.directory=/etc/traefik/dynamic
      - --entrypoints.web.address=:80
    volumes:
      - ./traefik:/etc/traefik/dynamic:ro
    ports:
      - "127.0.0.1:8081:8080"                             # Traefik dashboard
    networks:
      - edge-net
      - cluster-net-1
    depends_on:
      - consul-1

  api-gateway-2:
    image: traefik:latest
    container_name: api-gateway-2
    command:
      - --api.insecure=true                     # dashboard + API on :8080 (lab only)
      - --providers.consulcatalog.endpoint.address=consul:8500
      - --providers.consulcatalog.endpoint.scheme=http
      - --providers.consulcatalog.exposedByDefault=false
      - --providers.file.directory=/etc/traefik/dynamic
      - --entrypoints.web.address=:80
    volumes:
      - ./traefik:/etc/traefik/dynamic:ro
    ports:
      - "127.0.0.1:8082:8080"                             # Traefik dashboard
    networks:
      - edge-net
      - cluster-net-2
    depends_on:
      - consul-2

  # 4. SERVICE REGISTRY (one Consul agent per cluster)
  consul-1:
    image: hashicorp/consul:latest
    container_name: consul-1
    command: agent -server -bootstrap-expect=1 -client=0.0.0.0 -ui -data-dir=/consul/data
    ports:
      - "127.0.0.1:8501:8500"                             # HTTP API + UI
    networks:
      cluster-net-1:
        aliases:
          - consul

  consul-2:
    image: hashicorp/consul:latest
    container_name: consul-2
    command: agent -server -bootstrap-expect=1 -client=0.0.0.0 -ui -data-dir=/consul/data
    ports:
      - "127.0.0.1:8502:8500"                             # HTTP API + UI
    networks:
      cluster-net-2:
        aliases:
          - consul

  # 5. MOCK SERVICE (replicas self-register with Consul at runtime)
  mock-svc-1-1:
    build: ./mock-svc
    container_name: mock-svc-1-1
    volumes:
      - ./mock-svc/templates:/app/templates:ro
    environment:
      - CONSUL_ADDR=consul
    networks:
      - cluster-net-1
    depends_on:
      - consul-1

  mock-svc-1-2:
    build: ./mock-svc
    container_name: mock-svc-1-2
    volumes:
      - ./mock-svc/templates:/app/templates:ro
    environment:
      - CONSUL_ADDR=consul
    networks:
      - cluster-net-1
    depends_on:
      - consul-1

  mock-svc-2-1:
    build: ./mock-svc
    container_name: mock-svc-2-1
    volumes:
      - ./mock-svc/templates:/app/templates:ro
    environment:
      - CONSUL_ADDR=consul
    networks:
      - cluster-net-2
    depends_on:
      - consul-2

  mock-svc-2-2:
    build: ./mock-svc
    container_name: mock-svc-2-2
    volumes:
      - ./mock-svc/templates:/app/templates:ro
    environment:
      - CONSUL_ADDR=consul
    networks:
      - cluster-net-2
    depends_on:
      - consul-2

networks:
  edge-net:
    driver: bridge

  keycloak-net:
    driver: bridge

  keycloak-dc-1-net:
    driver: bridge

  keycloak-dc-2-net:
    driver: bridge

  cluster-net-1:
    driver: bridge

  cluster-net-2:
    driver: bridge

  # Control plane database cluster: Patroni nodes, etcd and their load balancer.
  control-plane-db-net:
    driver: bridge

volumes:
  control-plane-db-1-data:
  control-plane-db-2-data:
  control-plane-etcd-1-data:
  control-plane-etcd-2-data:
  control-plane-etcd-3-data:
