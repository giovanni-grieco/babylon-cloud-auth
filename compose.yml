services:
  #NATS Message Broker
  message-broker:
    image: nats:alpine
    container_name: message-broker
    command: -c /etc/nats/nats.conf
    ports:
      - "127.0.0.1:4222:4222" # client port
      - "127.0.0.1:6222:6222" # cluster port
      - "127.0.0.1:8222:8222" # monitoring port
    volumes:
      - ./nats/nats.conf:/etc/nats/nats.conf
      - ./nats/data:/data
    networks:
      - message-net

  # 0. LOAD BALANCER (public entrypoint)
  load-balancer:
    image: nginx:alpine
    container_name: load-balancer
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - edge-net
    depends_on:
      - api-gateway-1
      - api-gateway-2
      - central-auth-svc

  central-auth-svc:
    build:
      context: .
      dockerfile: central-auth-svc/Dockerfile
    container_name: central-auth-svc
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      edge-net:
        aliases:
          - central-auth-svc
      message-net:
    depends_on:
      central-auth-kv:
        condition: service_healthy
      state-kv:
        condition: service_healthy
      message-broker:
        condition: service_started
  central-auth-kv:
    image: redis:latest
    container_name: central-auth-kv
    volumes:
        - ./central-auth-kv:/data
    environment:
        - REDIS_ARGS=
    ports:
      - "127.0.0.1:6370:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 3
    networks:
      edge-net:
        aliases:
          - central-auth-kv

  state-kv:
    image: redis:latest
    container_name: state-kv
    volumes:
        - ./state-kv:/data
    environment:
        - REDIS_ARGS=
    ports:
      - "127.0.0.1:6371:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 3
    networks:
      edge-net:
        aliases:
          - state-kv

  # 1. API GATEWAY (one per cluster; duplicate for cluster B later)
  api-gateway-1:
    image: traefik:latest
    container_name: api-gateway-1
    command:
      - --api.insecure=true                     # dashboard + API on :8080 (lab only)
      - --providers.consulcatalog.endpoint.address=consul:8500
      - --providers.consulcatalog.endpoint.scheme=http
      - --providers.consulcatalog.exposedByDefault=false
      - --providers.file.directory=/etc/traefik/dynamic
      - --entrypoints.web.address=:80
    volumes:
      - ./traefik:/etc/traefik/dynamic:ro
    ports:
      - "127.0.0.1:8081:8080"                             # Traefik dashboard
    networks:
      - edge-net
      - cluster-net-1
    depends_on:
      - consul-1
  
  api-gateway-2:
    image: traefik:latest
    container_name: api-gateway-2
    command:
      - --api.insecure=true                     # dashboard + API on :8080 (lab only)
      - --providers.consulcatalog.endpoint.address=consul:8500
      - --providers.consulcatalog.endpoint.scheme=http
      - --providers.consulcatalog.exposedByDefault=false
      - --providers.file.directory=/etc/traefik/dynamic
      - --entrypoints.web.address=:80
    volumes:
      - ./traefik:/etc/traefik/dynamic:ro
    ports:
      - "127.0.0.1:8082:8080"                             # Traefik dashboard
    networks:
      - edge-net
      - cluster-net-2
    depends_on:
      - consul-2

  # 2. SERVICE REGISTRY (one Consul agent per cluster)
  consul-1:
    image: hashicorp/consul:latest
    container_name: consul-1
    command: agent -server -bootstrap-expect=1 -client=0.0.0.0 -ui -data-dir=/consul/data
    ports:
      - "127.0.0.1:8501:8500"                             # HTTP API + UI
    networks:
      cluster-net-1:
        aliases: 
          - consul
  
  consul-2:
    image: hashicorp/consul:latest
    container_name: consul-2
    command: agent -server -bootstrap-expect=1 -client=0.0.0.0 -ui -data-dir=/consul/data
    ports:
      - "127.0.0.1:8502:8500"                             # HTTP API + UI
    networks:
      cluster-net-2:
        aliases:
          - consul

  # 3. MOCK SERVICE (replicas self-register with Consul at runtime)
  mock-svc-1-1:
    build: ./mock-svc
    container_name: mock-svc-1-1
    volumes:
      - ./mock-svc/templates:/app/templates:ro
    environment:
      - CONSUL_ADDR=consul
    networks:
      - cluster-net-1
    depends_on:
      - consul-1
    
  mock-svc-1-2:
    build: ./mock-svc
    container_name: mock-svc-1-2
    volumes:
      - ./mock-svc/templates:/app/templates:ro
    environment:
      - CONSUL_ADDR=consul
    networks:
      - cluster-net-1
    depends_on:
      - consul-1
  
  mock-svc-2-1:
    build: ./mock-svc
    container_name: mock-svc-2-1
    volumes:
      - ./mock-svc/templates:/app/templates:ro
    environment:
      - CONSUL_ADDR=consul
    networks:
      - cluster-net-2
    depends_on:
      - consul-2
  
  mock-svc-2-2:
    build: ./mock-svc
    container_name: mock-svc-2-2
    volumes:
      - ./mock-svc/templates:/app/templates:ro
    environment:
      - CONSUL_ADDR=consul
    networks:
      - cluster-net-2
    depends_on:
      - consul-2

  # 4. AUTH SERVICE (self-registers with Consul at runtime)
  auth-svc-1:
    build:
      context: .
      dockerfile: auth-svc/Dockerfile
    container_name: auth-svc-1
    environment:
      - CONSUL_ADDR=consul
      - REALM_ID=dc-1
    networks:
      edge-net:
        aliases:
          - auth-svc-1
      cluster-net-1:
        aliases:
          - auth-svc
      message-net:
    depends_on:
      consul-1:
        condition: service_started
      auth-kv-1:
        condition: service_healthy
      state-kv:
        condition: service_healthy
      auth-db-1:
        condition: service_healthy
      message-broker:
        condition: service_started

  auth-kv-1:
    image: redis:latest
    container_name: auth-kv-1
    volumes:
        - ./auth-kv-1:/data
    environment:
        - REDIS_ARGS=
    ports:
      - "127.0.0.1:6361:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 3
    networks:
      cluster-net-1:
        aliases:
          - auth-kv
  
  auth-svc-2:
    build:
      context: .
      dockerfile: auth-svc/Dockerfile
    container_name: auth-svc-2
    environment:
      - CONSUL_ADDR=consul
      - REALM_ID=dc-2
    networks:
      edge-net:
          aliases:
            - auth-svc-2
      cluster-net-2:
        aliases:
          - auth-svc
      message-net:
    depends_on:
      consul-2:
        condition: service_started
      auth-kv-2:
        condition: service_healthy
      state-kv:
        condition: service_healthy
      auth-db-2:
        condition: service_healthy
      message-broker:
        condition: service_started
  
  auth-kv-2:
    image: redis:latest
    container_name: auth-kv-2
    volumes:
        - ./auth-kv-2:/data
    environment:
        - REDIS_ARGS=
    ports:
      - "127.0.0.1:6362:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 3
    networks:
      cluster-net-2:
        aliases:
          - auth-kv

  auth-db-1:
    image: postgres:latest
    container_name: auth-db-1
    ports:
      - "127.0.0.1:5431:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=auth-db
      - TZ=Europe/Rome
    volumes:
      - ./auth-db-1:/var/lib/postgresql/18
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      cluster-net-1:
        aliases:
          - auth-db
  auth-db-2:
    image: postgres:latest
    container_name: auth-db-2
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=auth-db
      - TZ=Europe/Rome
    volumes:
      - ./auth-db-2:/var/lib/postgresql/18
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      cluster-net-2:
        aliases:
          - auth-db

networks:
  edge-net:
    driver: bridge

  cluster-net-1:
    driver: bridge
  
  cluster-net-2:
    driver: bridge
  
  message-net:
    driver: bridge