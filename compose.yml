x-keycloak-env: &keycloak-env
  KC_DB: postgres
  KC_DB_USERNAME: keycloak
  KC_PROXY_HEADERS: xforwarded
  KC_HEALTH_ENABLED: "true"

x-keycloak-base: &keycloak-base
  command: start-dev --import-realm # lab only; use `start` with HTTPS in production
  healthcheck:
    # The image has no curl, so talk to the management port through bash.
    test:
      - CMD-SHELL
      - >-
        exec 3<>/dev/tcp/127.0.0.1/9000 &&
        printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
        grep -q '"UP"' <&3
    interval: 5s
    timeout: 5s
    retries: 30
    start_period: 30s

x-keycloak-db-env: &keycloak-db-env
  POSTGRES_USER: keycloak
  POSTGRES_DB: keycloak
  TZ: Europe/Rome

x-keycloak-db-base: &keycloak-db-base
  image: postgres:17
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
    interval: 5s
    timeout: 5s
    retries: 5

x-oauth2-proxy-base: &oauth2-proxy-base
  image: quay.io/oauth2-proxy/oauth2-proxy:v7.12.0
  restart: unless-stopped # retries OIDC discovery if the issuer isn't reachable yet
  command:
    - --http-address=0.0.0.0:4180
    - --provider=keycloak-oidc
    - --client-id=gateway
    - --oidc-issuer-url=http://auth.babylon.test/realms/babylon
    - --redirect-url=http://babylon.test/oauth2/callback
    - --code-challenge-method=S256
    - --email-domain=*
    - --oidc-email-claim=sub # central tokens carry no email, by design
    - --insecure-oidc-allow-unverified-email=true # there's no email_verified claim either
    - --skip-provider-button=true
    - --reverse-proxy=true
    - --upstream=static://202 # authenticated: answer forwardAuth without proxying anywhere
    - --set-xauthrequest=true
    - --cookie-domain=.babylon.test
    - --whitelist-domain=.babylon.test
    - --cookie-secure=false # lab only; remove with HTTPS
    - --cookie-refresh=4m # shorter than the 5 minute access token
    - --cookie-expire=10h # matches Keycloak's SSO session max
    #- --session-store-type=redis
    #- --redis-connection-url=redis://state-kv:6379
  environment:
    OAUTH2_PROXY_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?run start.sh or copy .env.example to .env}
    OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:?run start.sh or copy .env.example to .env}
  depends_on:
    keycloak:
      condition: service_healthy
    load-balancer:
      condition: service_started
    #state-kv:
      #condition: service_healthy

services:
  # 0. LOAD BALANCER (public entrypoint)
  load-balancer:
    image: nginx:alpine
    container_name: load-balancer
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      edge-net:
        aliases:
          # Containers resolve the issuer to nginx, exactly like the browser does,
          # so the token issuer URL is the same on both sides.
          - auth.babylon.test
          - auth.dc-1.babylon.test
          - auth.dc-2.babylon.test
    depends_on:
      - api-gateway-1
      - api-gateway-2
      - keycloak
      - keycloak-dc-1
      - keycloak-dc-2

  # Operator console for provisioning B2B accounts into the DC realms, at
  # http://control-plane.babylon.test. It has no login of its own; nginx only
  # lets this machine reach it.
  control-plane-svc:
    build:
      context: .
      dockerfile: ./control-plane-svc/Dockerfile
    container_name: control-plane-svc
    environment:
      PORT: "8080"
      CP_CONFIG: /etc/control-plane/config.json
      CENTRAL_CONTROL_PLANE_SECRET: ${CENTRAL_CONTROL_PLANE_SECRET:?run start.sh or copy .env.example to .env}
      DC1_CONTROL_PLANE_SECRET: ${DC1_CONTROL_PLANE_SECRET:?run start.sh or copy .env.example to .env}
      DC2_CONTROL_PLANE_SECRET: ${DC2_CONTROL_PLANE_SECRET:?run start.sh or copy .env.example to .env}
    volumes:
      - ./control-plane-svc/config.json:/etc/control-plane/config.json:ro
    networks:
      - edge-net # reaches every Keycloak through the load balancer, like the browser
    depends_on:
      load-balancer:
        condition: service_started

  # 1. CENTRAL IDENTITY BROKER: the single login point. It routes B2B email domains
  #    to the DC Keycloak that owns the user, and stores self-registered B2C users itself.
  keycloak:
    <<: *keycloak-base
    build: ./keycloak/central
    container_name: keycloak
    environment:
      <<: *keycloak-env
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?run start.sh or copy .env.example to .env}
      KC_HOSTNAME: http://auth.babylon.test
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USERNAME:?run start.sh or copy .env.example to .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?run start.sh or copy .env.example to .env}
      # Read by the realm import
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?run start.sh or copy .env.example to .env}
      DC1_BROKER_SECRET: ${DC1_BROKER_SECRET:?run start.sh or copy .env.example to .env}
      DC2_BROKER_SECRET: ${DC2_BROKER_SECRET:?run start.sh or copy .env.example to .env}
      CENTRAL_CONTROL_PLANE_SECRET: ${CENTRAL_CONTROL_PLANE_SECRET:?run start.sh or copy .env.example to .env}
    volumes:
      - ./keycloak/central/import:/opt/keycloak/data/import:ro
    networks:
      - edge-net
      - keycloak-net
    depends_on:
      keycloak-db:
        condition: service_healthy

  # Catches the central realm's verification and password-reset emails (lab only).
  # Inbox: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31.6
    container_name: mailpit
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - keycloak-net

  keycloak-db:
    <<: *keycloak-db-base
    container_name: keycloak-db
    environment:
      <<: *keycloak-db-env
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:?run start.sh or copy .env.example to .env}
    volumes:
      - ./keycloak-db-data:/var/lib/postgresql/data
    networks:
      - keycloak-net

  # 1a. DC IDENTITY PROVIDERS: each owns its users, on a database no other DC can reach.
  keycloak-dc-1:
    <<: *keycloak-base
    image: quay.io/keycloak/keycloak:26.7.0
    container_name: keycloak-dc-1
    environment:
      <<: *keycloak-env
      KC_DB_URL: jdbc:postgresql://keycloak-dc-1-db:5432/keycloak
      KC_DB_PASSWORD: ${DC1_DB_PASSWORD:?run start.sh or copy .env.example to .env}
      KC_HOSTNAME: http://auth.dc-1.babylon.test
      KC_BOOTSTRAP_ADMIN_USERNAME: ${DC1_ADMIN_USERNAME:?run start.sh or copy .env.example to .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${DC1_ADMIN_PASSWORD:?run start.sh or copy .env.example to .env}
      # Read by the realm import
      DC1_BROKER_SECRET: ${DC1_BROKER_SECRET:?run start.sh or copy .env.example to .env}
      DC1_CONTROL_PLANE_SECRET: ${DC1_CONTROL_PLANE_SECRET:?run start.sh or copy .env.example to .env}
    volumes:
      - ./keycloak/dc-1/import:/opt/keycloak/data/import:ro
    networks:
      - edge-net
      - keycloak-dc-1-net
    depends_on:
      keycloak-dc-1-db:
        condition: service_healthy

  keycloak-dc-1-db:
    <<: *keycloak-db-base
    container_name: keycloak-dc-1-db
    environment:
      <<: *keycloak-db-env
      POSTGRES_PASSWORD: ${DC1_DB_PASSWORD:?run start.sh or copy .env.example to .env}
    volumes:
      - ./keycloak-dc-1-db-data:/var/lib/postgresql/data
    networks:
      - keycloak-dc-1-net

  keycloak-dc-2:
    <<: *keycloak-base
    image: quay.io/keycloak/keycloak:26.7.0
    container_name: keycloak-dc-2
    environment:
      <<: *keycloak-env
      KC_DB_URL: jdbc:postgresql://keycloak-dc-2-db:5432/keycloak
      KC_DB_PASSWORD: ${DC2_DB_PASSWORD:?run start.sh or copy .env.example to .env}
      KC_HOSTNAME: http://auth.dc-2.babylon.test
      KC_BOOTSTRAP_ADMIN_USERNAME: ${DC2_ADMIN_USERNAME:?run start.sh or copy .env.example to .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${DC2_ADMIN_PASSWORD:?run start.sh or copy .env.example to .env}
      # Read by the realm import
      DC2_BROKER_SECRET: ${DC2_BROKER_SECRET:?run start.sh or copy .env.example to .env}
      DC2_CONTROL_PLANE_SECRET: ${DC2_CONTROL_PLANE_SECRET:?run start.sh or copy .env.example to .env}
    volumes:
      - ./keycloak/dc-2/import:/opt/keycloak/data/import:ro
    networks:
      - edge-net
      - keycloak-dc-2-net
    depends_on:
      keycloak-dc-2-db:
        condition: service_healthy

  keycloak-dc-2-db:
    <<: *keycloak-db-base
    container_name: keycloak-dc-2-db
    environment:
      <<: *keycloak-db-env
      POSTGRES_PASSWORD: ${DC2_DB_PASSWORD:?run start.sh or copy .env.example to .env}
    volumes:
      - ./keycloak-dc-2-db-data:/var/lib/postgresql/data
    networks:
      - keycloak-dc-2-net

  # 2. OIDC CLIENT, ONE PER GATEWAY (Traefik's forwardAuth target)
  #    The oauth2-proxy alias exists only on the cluster network, so each gateway
  #    reaches its own instance. Don't add it to edge-net, where both gateways would see both.
  oauth2-proxy-1:
    <<: *oauth2-proxy-base
    container_name: oauth2-proxy-1
    networks:
      edge-net: # reaches Keycloak and Redis
      cluster-net-1:
        aliases:
          - oauth2-proxy

  oauth2-proxy-2:
    <<: *oauth2-proxy-base
    container_name: oauth2-proxy-2
    networks:
      edge-net: # reaches Keycloak and Redis
      cluster-net-2:
        aliases:
          - oauth2-proxy

  # 3. API GATEWAY (one per cluster; duplicate for cluster B later)
  api-gateway-1:
    image: traefik:latest
    container_name: api-gateway-1
    command:
      - --api.insecure=true                     # dashboard + API on :8080 (lab only)
      - --providers.consulcatalog.endpoint.address=consul:8500
      - --providers.consulcatalog.endpoint.scheme=http
      - --providers.consulcatalog.exposedByDefault=false
      - --providers.file.directory=/etc/traefik/dynamic
      - --entrypoints.web.address=:80
    volumes:
      - ./traefik:/etc/traefik/dynamic:ro
    ports:
      - "127.0.0.1:8081:8080"                             # Traefik dashboard
    networks:
      - edge-net
      - cluster-net-1
    depends_on:
      - consul-1

  api-gateway-2:
    image: traefik:latest
    container_name: api-gateway-2
    command:
      - --api.insecure=true                     # dashboard + API on :8080 (lab only)
      - --providers.consulcatalog.endpoint.address=consul:8500
      - --providers.consulcatalog.endpoint.scheme=http
      - --providers.consulcatalog.exposedByDefault=false
      - --providers.file.directory=/etc/traefik/dynamic
      - --entrypoints.web.address=:80
    volumes:
      - ./traefik:/etc/traefik/dynamic:ro
    ports:
      - "127.0.0.1:8082:8080"                             # Traefik dashboard
    networks:
      - edge-net
      - cluster-net-2
    depends_on:
      - consul-2

  # 4. SERVICE REGISTRY (one Consul agent per cluster)
  consul-1:
    image: hashicorp/consul:latest
    container_name: consul-1
    command: agent -server -bootstrap-expect=1 -client=0.0.0.0 -ui -data-dir=/consul/data
    ports:
      - "127.0.0.1:8501:8500"                             # HTTP API + UI
    networks:
      cluster-net-1:
        aliases:
          - consul

  consul-2:
    image: hashicorp/consul:latest
    container_name: consul-2
    command: agent -server -bootstrap-expect=1 -client=0.0.0.0 -ui -data-dir=/consul/data
    ports:
      - "127.0.0.1:8502:8500"                             # HTTP API + UI
    networks:
      cluster-net-2:
        aliases:
          - consul

  # 5. MOCK SERVICE (replicas self-register with Consul at runtime)
  mock-svc-1-1:
    build: ./mock-svc
    container_name: mock-svc-1-1
    volumes:
      - ./mock-svc/templates:/app/templates:ro
    environment:
      - CONSUL_ADDR=consul
    networks:
      - cluster-net-1
    depends_on:
      - consul-1

  mock-svc-1-2:
    build: ./mock-svc
    container_name: mock-svc-1-2
    volumes:
      - ./mock-svc/templates:/app/templates:ro
    environment:
      - CONSUL_ADDR=consul
    networks:
      - cluster-net-1
    depends_on:
      - consul-1

  mock-svc-2-1:
    build: ./mock-svc
    container_name: mock-svc-2-1
    volumes:
      - ./mock-svc/templates:/app/templates:ro
    environment:
      - CONSUL_ADDR=consul
    networks:
      - cluster-net-2
    depends_on:
      - consul-2

  mock-svc-2-2:
    build: ./mock-svc
    container_name: mock-svc-2-2
    volumes:
      - ./mock-svc/templates:/app/templates:ro
    environment:
      - CONSUL_ADDR=consul
    networks:
      - cluster-net-2
    depends_on:
      - consul-2

networks:
  edge-net:
    driver: bridge

  keycloak-net:
    driver: bridge

  keycloak-dc-1-net:
    driver: bridge

  keycloak-dc-2-net:
    driver: bridge

  cluster-net-1:
    driver: bridge

  cluster-net-2:
    driver: bridge

volumes:
  keycloak-db-data:
