# oauth2-proxy in front of the control plane console, shared by
# control-plane-oauth2-proxy-1 and -2. Unlike oauth2-proxy.cfg (forwardAuth
# behind Traefik) this one is a full reverse proxy: control-plane-lb sends it
# every console request and it forwards the authenticated ones back to
# control-plane-lb:8082, which balances over the replicas.
#
# Secrets are NOT stored here, see compose/control-plane.yml:
#   OAUTH2_PROXY_CLIENT_SECRET
#   OAUTH2_PROXY_COOKIE_SECRET

http_address = "0.0.0.0:4180"

## Provider: the operators' own Keycloak, not the central one
provider = "keycloak-oidc"
client_id = "control-plane-console"
oidc_issuer_url = "http://auth.control-plane.babylon.test/realms/babylon-operators"
redirect_url = "http://control-plane.babylon.test/oauth2/callback"
code_challenge_method = "S256"
email_domains = ["*"]
allowed_roles = ["operator"]                # realm role; a realm user without it gets 403
skip_provider_button = true
# /oauth2/sign_out also ends the Keycloak session, server to server
backend_logout_url = "http://auth.control-plane.babylon.test/realms/babylon-operators/protocol/openid-connect/logout?id_token_hint={id_token}"

## Upstream
upstreams = ["http://control-plane:8082"]
upstream_timeout = "600s"                   # a large import makes one Keycloak call per user
reverse_proxy = true                        # trust X-Forwarded-* from nginx/HAProxy
pass_host_header = true                     # CrossOriginProtection compares Origin with Host
pass_user_headers = true                    # X-Forwarded-User / -Email reach the console

## Cookie / session
# Host-only and with its own name: the mock services' _oauth2_proxy cookie is
# set on .babylon.test, so it reaches this host too and must not collide.
cookie_name = "_babylon_cp"
cookie_domains = ["control-plane.babylon.test"]
whitelist_domains = ["control-plane.babylon.test"]
cookie_secure = false                       # lab only; remove with HTTPS
cookie_samesite = "lax"
cookie_refresh = "4m"                       # shorter than the 5 minute access token
cookie_expire = "8h"                        # matches the realm's SSO session max
