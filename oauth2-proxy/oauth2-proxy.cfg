# oauth2-proxy configuration, shared by oauth2-proxy-1 and oauth2-proxy-2.
#
# Secrets are NOT stored here: oauth2-proxy reads them from the environment
# (env vars override this file), see the oauth2-proxy-base anchor in compose/dc-*.yml:
#   OAUTH2_PROXY_CLIENT_SECRET
#   OAUTH2_PROXY_COOKIE_SECRET

http_address = "0.0.0.0:4180"

## Provider
provider = "keycloak-oidc"
client_id = "gateway"
oidc_issuer_url = "http://auth.babylon.test/realms/babylon"
redirect_url = "http://babylon.test/oauth2/callback"
code_challenge_method = "S256"
email_domains = ["*"]
oidc_email_claim = "sub"                    # central tokens carry no email, by design
insecure_oidc_allow_unverified_email = true # there's no email_verified claim either
skip_provider_button = true

## Upstream / forwardAuth
reverse_proxy = true
upstreams = ["static://202"]                # authenticated: answer forwardAuth without proxying anywhere
set_xauthrequest = true

## Cookie / session
cookie_domains = ["babylon.test", "*.babylon.test"]
whitelist_domains = ["babylon.test", "*.babylon.test"]
cookie_secure = false                       # lab only; remove with HTTPS
cookie_refresh = "4m"                       # shorter than the 5 minute access token
cookie_expire = "10h"                       # matches Keycloak's SSO session max
# session_store_type = "redis"
# redis_connection_url = "redis://state-kv:6379"
