events {
    worker_connections 1024;
}

http {

    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream gateways {
        zone gateways 64k;
        hash $remote_addr consistent;
        server api-gateway-1:80 resolve max_fails=3 fail_timeout=10s;
        server api-gateway-2:80 resolve max_fails=3 fail_timeout=10s;
    }

    # Central auth portal (phase 1: username + home realm discovery)
    upstream central_auth {
        zone central_auth 64k;
        server central-auth-svc:80 resolve;
    }

    # One upstream per realm, single server: never fail over to another DC
    upstream realm_dc1 {
        zone realm_dc1 64k;
        server api-gateway-1:80 resolve;
    }

    upstream realm_dc2 {
        zone realm_dc2 64k;
        server api-gateway-2:80 resolve;
    }

    server {
        listen 80;

        # Inherited by every location that doesn't set its own proxy_set_header
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;

        location /login {
            proxy_pass http://central_auth;
        }

        # Trailing slash strips the prefix: /realm/dc-1/login?transaction=X -> api-gateway-1/login?transaction=X
        location /realm/dc-1/ {
            proxy_pass http://realm_dc1/;
        }

        location /realm/dc-2/ {
            proxy_pass http://realm_dc2/;
        }

        location / {
            proxy_pass http://gateways;
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        }
    }
}
