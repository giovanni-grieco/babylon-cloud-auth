events {
    worker_connections 1024;
}

http {

    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream gateways {
        zone gateways 64k;
        hash $remote_addr consistent;
        server api-gateway-1:80 resolve max_fails=3 fail_timeout=10s;
        server api-gateway-2:80 resolve max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;

        location /login {
            proxy_pass http://central-auth-svc:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /_realm/dc-x/ {
            rewrite ^/_realm/dc-x/(.*)$ /$1 break;
            proxy_pass http://api-gateway-1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /_realm/dc-y/ {
            rewrite ^/_realm/dc-y/(.*)$ /$1 break;
            proxy_pass http://api-gateway-2;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://gateways;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 2s;
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        }
    }
}