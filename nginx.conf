events {
    worker_connections 1024;
}

http {

    resolver 127.0.0.11 valid=10s ipv6=off;

    # Inherited by every location below
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_connect_timeout 2s;

    # Keycloak and oauth2-proxy send large cookies and redirect URLs
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    upstream gateways {
        zone gateways 64k;
        hash $remote_addr consistent;
        server api-gateway-1:80 resolve max_fails=3 fail_timeout=10s;
        server api-gateway-2:80 resolve max_fails=3 fail_timeout=10s;
    }

    upstream keycloak {
        zone keycloak 64k;
        server keycloak:8080 resolve max_fails=3 fail_timeout=10s;
    }

    upstream keycloak_dc1 {
        zone keycloak_dc1 64k;
        server keycloak-dc-1:8080 resolve max_fails=3 fail_timeout=10s;
    }

    upstream keycloak_dc2 {
        zone keycloak_dc2 64k;
        server keycloak-dc-2:8080 resolve max_fails=3 fail_timeout=10s;
    }

    upstream control_plane {
        zone control_plane 64k;
        server control-plane-svc:8080 resolve max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80 default_server;
        server_name babylon.test;

        location / {
            proxy_pass http://gateways;
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        }
    }

    server {
        listen 80;
        server_name control.babylon.test

        location / {
            proxy_pass http://control_plane
        }
    }

    server {
        listen 80;
        server_name auth.babylon.test;

        location / {
            proxy_pass http://keycloak;
        }
    }

    server {
        listen 80;
        server_name auth.dc-1.babylon.test;

        location / {
            proxy_pass http://keycloak_dc1;
        }
    }

    server {
        listen 80;
        server_name auth.dc-2.babylon.test;

        location / {
            proxy_pass http://keycloak_dc2;
        }
    }
}
