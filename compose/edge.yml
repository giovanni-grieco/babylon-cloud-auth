x-keycloak-env: &keycloak-env
  KC_DB: "postgres"
  KC_DB_USERNAME: "keycloak"
  KC_HEALTH_ENABLED: "true"
  KC_METRICS_ENABLED: "true"
  KC_CACHE: "ispn"
  KC_PROXY_HEADERS: "xforwarded"
  KC_HTTP_ENABLED: "true"
  KC_HOSTNAME: "http://auth.babylon.test"
  # Per node. The sum over all nodes must stay below Postgres max_connections
  # (100) and HAProxy's maxconn (100 per server).
  KC_DB_POOL_INITIAL_SIZE: "5"
  KC_DB_POOL_MIN_SIZE: "5"
  KC_DB_POOL_MAX_SIZE: "30"

  KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
  KC_DB_PASSWORD: ${CENTRAL_KC_DB_PASSWORD:?run start.sh or copy .env.example to .env}
  KC_BOOTSTRAP_ADMIN_USERNAME: ${CENTRAL_KC_ADMIN_USERNAME:?run start.sh or copy .env.example to .env}
  KC_BOOTSTRAP_ADMIN_PASSWORD: ${CENTRAL_KC_ADMIN_PASSWORD:?run start.sh or copy .env.example to .env}
  HRD_ORACLE_URL: http://control-plane:8081/api/v1/discover
  KC_VAULT: file
  KC_VAULT_DIR: /run/secrets

x-keycloak-base: &keycloak-base
  command: start --import-realm # plain HTTP behind nginx (KC_HTTP_ENABLED): lab only
  # Exits when the database isn't reachable yet (Patroni is still electing a
  # primary) and comes back once it is.
  restart: unless-stopped
  healthcheck:
    # The image has no curl, so talk to the management port through bash.
    test:
      - CMD-SHELL
      - >-
        exec 3<>/dev/tcp/127.0.0.1/9000 &&
        printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
        grep -q '"UP"' <&3
    interval: 15s
    timeout: 15s
    retries: 30
    start_period: 60s

# Central Keycloak database: two Postgres nodes run by Patroni (shared image in
# patroni-db/), one primary and one hot standby in synchronous replication.
# The leader lock lives in the shared etcd (compose/etcd.yml) under the
# "keycloak" scope. Keycloak reaches the primary through keycloak-db-lb.
x-keycloak-db-env: &keycloak-db-env
  PATRONI_SCOPE: keycloak
  PATRONI_SUPERUSER_USERNAME: postgres
  PATRONI_SUPERUSER_PASSWORD: ${CENTRAL_KC_DB_SUPERUSER_PASSWORD:?run start.sh or copy .env.example to .env}
  PATRONI_REPLICATION_USERNAME: replicator
  PATRONI_REPLICATION_PASSWORD: ${CENTRAL_KC_DB_REPLICATION_PASSWORD:?run start.sh or copy .env.example to .env}
  # Read by post_bootstrap.sh when the cluster is first created
  APP_DB_USER: keycloak
  APP_DB_NAME: keycloak
  APP_DB_PASSWORD: ${CENTRAL_KC_DB_PASSWORD:?run start.sh or copy .env.example to .env}
  TZ: Europe/Rome

x-keycloak-db-base: &keycloak-db-base
  build: ./patroni-db
  image: babylon/patroni-db:local  # same image as the control plane database
  restart: unless-stopped
  healthcheck:
    # Patroni's /health is 200 while Postgres runs, as primary or replica.
    test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/health', timeout=3)"]
    interval: 15s
    timeout: 15s
    retries: 30
    start_period: 60s
  networks:
    - keycloak-db-net   # reached only through keycloak-db-lb
    - central-etcd-net  # leader lock
  depends_on:
    - control-plane-etcd-1
    - control-plane-etcd-2
    - control-plane-etcd-3

services:
  load-balancer:
    image: nginx:alpine
    container_name: load-balancer
    ports:
      - "80:80"
    volumes:
      - ./edge-pop-lb/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      edge-net:
        aliases:
          # Containers resolve the issuer to nginx, exactly like the browser does,
          # so the token issuer URL is the same on both sides.
          - auth.babylon.test
          - auth.dc1.babylon.test
          - auth.dc2.babylon.test
          - auth.control-plane.babylon.test
  
  # Catches the central realm's verification and password-reset emails (lab only).
  # Inbox: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31.6
    container_name: mailpit
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - edge-net

  # Spreads auth.babylon.test over the central Keycloak nodes. It owns the
  # "keycloak-central" name on edge-net, so nginx doesn't know how many nodes
  # there are.
  keycloak-central-lb:
    image: haproxy:3.2-alpine
    container_name: keycloak-central-lb
    volumes:
      - ./keycloak-central-lb/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "127.0.0.1:8407:8404"  # HAProxy stats
    networks:
      edge-net:
        aliases:
          - keycloak-central  # nginx's upstream for auth.babylon.test
    depends_on:
      - keycloak-central-1
      - keycloak-central-2

  keycloak-central-1:
    <<: *keycloak-base
    build: ./keycloak/central
    container_name: keycloak-central-1
    environment:
      <<: *keycloak-env
    secrets:
        - babylon_CONTROL-PLANE-CENTRAL-KEYCLOAK-CLIENT-SECRET
        - babylon_OAUTH2-PROXY-OIDC-CLIENT-SECRET
        - babylon_CENTRAL-KEYCLOAK-DC1-BROKER-SECRET
        - babylon_CENTRAL-KEYCLOAK-DC2-BROKER-SECRET
        - babylon_CONTROL-PLANE-CLIENT-SECRET
    volumes:
      - ./keycloak/central/import:/opt/keycloak/data/import:ro
    networks:
      - edge-net
    depends_on:
      keycloak-db-lb:
        condition: service_started

  keycloak-central-2:
    <<: *keycloak-base
    build: ./keycloak/central
    container_name: keycloak-central-2
    environment:
      <<: *keycloak-env
    secrets:
        - babylon_CONTROL-PLANE-CENTRAL-KEYCLOAK-CLIENT-SECRET
        - babylon_OAUTH2-PROXY-OIDC-CLIENT-SECRET
        - babylon_CENTRAL-KEYCLOAK-DC1-BROKER-SECRET
        - babylon_CENTRAL-KEYCLOAK-DC2-BROKER-SECRET
        - babylon_CONTROL-PLANE-CLIENT-SECRET
    volumes:
      - ./keycloak/central/import:/opt/keycloak/data/import:ro
    networks:
      - edge-net
    depends_on:
      keycloak-central-1:
        condition: service_healthy
      keycloak-db-lb:
        condition: service_started

  # Always forwards :5432 to whichever node Patroni says is the primary. The
  # only database container on edge-net: it owns the "keycloak-db" name, so
  # KC_DB_URL doesn't know how many nodes there are.
  keycloak-db-lb:
    image: haproxy:3.2-alpine
    container_name: keycloak-db-lb
    volumes:
      - ./keycloak-db-lb/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "5430:5432"            # primary, read-write (lab only; remove with HTTPS)
      - "127.0.0.1:5435:5433"  # replicas, read-only
      - "127.0.0.1:8406:8404"  # HAProxy stats
    networks:
      edge-net:
        aliases:
          - keycloak-db  # KC_DB_URL of the central Keycloak nodes
      keycloak-db-net:
    depends_on:
      - keycloak-db-1
      - keycloak-db-2

  keycloak-db-1:
    <<: *keycloak-db-base
    container_name: keycloak-db-1
    environment:
      <<: *keycloak-db-env
      PATRONI_NAME: keycloak-db-1
      PATRONI_RESTAPI_CONNECT_ADDRESS: keycloak-db-1:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: keycloak-db-1:5432
    volumes:
      - keycloak-db-1-data:/var/lib/postgresql/data

  keycloak-db-2:
    <<: *keycloak-db-base
    container_name: keycloak-db-2
    environment:
      <<: *keycloak-db-env
      PATRONI_NAME: keycloak-db-2
      PATRONI_RESTAPI_CONNECT_ADDRESS: keycloak-db-2:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: keycloak-db-2:5432
    volumes:
      - keycloak-db-2-data:/var/lib/postgresql/data


networks:
  edge-net:
    driver: bridge

  # Central Keycloak database cluster: Patroni nodes and their load balancer.
  keycloak-db-net:
    driver: bridge

volumes:
  keycloak-db-1-data:
  keycloak-db-2-data:

secrets: # I segreti per keycloak devono avere la sintassi <nome_realm>_<nomesegreto>. Nel nostro caso il realm creato è "babylon"
  babylon_CONTROL-PLANE-CENTRAL-KEYCLOAK-CLIENT-SECRET:
    environment: CONTROL_PLANE_CENTRAL_KEYCLOAK_CLIENT_SECRET

  babylon_OAUTH2-PROXY-OIDC-CLIENT-SECRET:
    environment: OAUTH2_PROXY_OIDC_CLIENT_SECRET

  babylon_CENTRAL-KEYCLOAK-DC1-BROKER-SECRET:
    environment: CENTRAL_KEYCLOAK_DC1_BROKER_SECRET

  babylon_CENTRAL-KEYCLOAK-DC2-BROKER-SECRET:
    environment: CENTRAL_KEYCLOAK_DC2_BROKER_SECRET

  babylon_CONTROL-PLANE-CLIENT-SECRET:
    environment: CONTROL_PLANE_CLIENT_SECRET
