x-realm-env: &realm-env
  REALM: dc1

x-keycloak-env: &keycloak-env
  KC_DB: postgres
  KC_DB_USERNAME: keycloak
  KC_PROXY_HEADERS: xforwarded
  KC_HEALTH_ENABLED: "true"
  KC_VAULT: file
  KC_VAULT_DIR: /run/secrets

x-keycloak-base: &keycloak-base
  command: start-dev --import-realm # lab only; use `start` with HTTPS in production
  healthcheck:
    # The image has no curl, so talk to the management port through bash.
    test:
      - CMD-SHELL
      - >-
        exec 3<>/dev/tcp/127.0.0.1/9000 &&
        printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
        grep -q '"UP"' <&3
    interval: 15s
    timeout: 30s
    retries: 30
    start_period: 120s

x-keycloak-db-env: &keycloak-db-env
  POSTGRES_USER: keycloak
  POSTGRES_DB: keycloak
  TZ: Europe/Rome

x-keycloak-db-base: &keycloak-db-base
  image: postgres:17
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
    interval: 15s
    timeout: 30s
    retries: 30
    start_period: 120s

x-oauth2-proxy-base: &oauth2-proxy-base
  image: quay.io/oauth2-proxy/oauth2-proxy:v7.12.0
  restart: unless-stopped # retries OIDC discovery if the issuer isn't reachable yet
  command:
    - --config=/etc/oauth2-proxy/oauth2-proxy.cfg
  volumes:
    - ./oauth2-proxy/oauth2-proxy.cfg:/etc/oauth2-proxy/oauth2-proxy.cfg:ro
  # Secrets stay out of the cfg file: oauth2-proxy reads OAUTH2_PROXY_* env vars,
  # which take precedence over the config file.
  environment:
    OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_OIDC_CLIENT_SECRET:?run start.sh or copy .env.example to .env}
    OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:?run start.sh or copy .env.example to .env}

services:
  keycloak-dc-1:
    <<: *keycloak-base
    image: quay.io/keycloak/keycloak:26.7.0
    container_name: keycloak-dc-1
    environment:
      <<: *keycloak-env
      KC_DB_URL: jdbc:postgresql://keycloak-dc-1-db:5432/keycloak
      KC_DB_PASSWORD: ${DC1_KEYCLOAK_DB_PASSWORD:?run start.sh or copy .env.example to .env}
      KC_HOSTNAME: http://auth.dc1.babylon.test
      KC_BOOTSTRAP_ADMIN_USERNAME: ${DC1_KEYCLOAK_ADMIN_USERNAME:?run start.sh or copy .env.example to .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${DC1_KEYCLOAK_ADMIN_PASSWORD:?run start.sh or copy .env.example to .env}

    secrets:
      - babylon_CENTRAL-KEYCLOAK-DC1-BROKER-SECRET
      - babylon_DC1-CONTROL-PLANE-KEYCLOAK-CLIENT-SECRET
    volumes:
      - ./keycloak/dc-1/import:/opt/keycloak/data/import:ro
    networks:
      - edge-net
      - keycloak-dc-1-net
    depends_on:
      keycloak-dc-1-db:
        condition: service_healthy
  
  keycloak-dc-1-db:
    <<: *keycloak-db-base
    container_name: keycloak-dc-1-db
    environment:
      <<: *keycloak-db-env
      POSTGRES_PASSWORD: ${DC1_KEYCLOAK_DB_PASSWORD:?run start.sh or copy .env.example to .env}
    ports:
      - "5431:5432" # lab only; remove with HTTPS
    volumes:
      - ./keycloak-dc-1-db-data:/var/lib/postgresql/data
    networks:
      - keycloak-dc-1-net

  oauth2-proxy-1:
    <<: *oauth2-proxy-base
    container_name: oauth2-proxy-1
    networks:
      edge-net:
      cluster-net-1:
        aliases:
          - oauth2-proxy
  
  api-gateway-1:
    image: traefik:latest
    container_name: api-gateway-1
    command:
      - --api.insecure=true                     # dashboard + API on :8080 (lab only)
      - --providers.consulcatalog.endpoint.address=consul:8500
      - --providers.consulcatalog.endpoint.scheme=http
      - --providers.consulcatalog.exposedByDefault=false
      - --providers.file.directory=/etc/traefik/dynamic
      - --entrypoints.web.address=:80
    volumes:
      - ./traefik:/etc/traefik/dynamic:ro
    ports:
      - "127.0.0.1:8081:8080"                             # Traefik dashboard
    networks:
      - edge-net
      - cluster-net-1
    depends_on:
      - consul-1

  consul-1:
    image: hashicorp/consul:latest
    container_name: consul-1
    command: agent -server -bootstrap-expect=1 -client=0.0.0.0 -ui -data-dir=/consul/data
    ports:
      - "127.0.0.1:8501:8500"                             # HTTP API + UI
    networks:
      cluster-net-1:
        aliases:
          - consul

  mock-svc-1-1:
    build: ./mock-svc
    container_name: mock-svc-1-1
    volumes:
      - ./mock-svc/templates:/app/templates:ro
    environment:
      <<: *realm-env
      CONSUL_ADDR: consul
    networks:
      - cluster-net-1
    depends_on:
      - consul-1

  mock-svc-1-2:
    build: ./mock-svc
    container_name: mock-svc-1-2
    volumes:
      - ./mock-svc/templates:/app/templates:ro
    environment:
      <<: *realm-env
      CONSUL_ADDR: consul
    networks:
      - cluster-net-1
    depends_on:
      - consul-1

networks:
  cluster-net-1:
    driver: bridge
  keycloak-dc-1-net:
    driver: bridge

secrets:
  babylon_CENTRAL-KEYCLOAK-DC1-BROKER-SECRET:
    environment: CENTRAL_KEYCLOAK_DC1_BROKER_SECRET

  babylon_DC1-CONTROL-PLANE-KEYCLOAK-CLIENT-SECRET:
    environment: DC1_CONTROL_PLANE_KEYCLOAK_CLIENT_SECRET