x-control-plane-svc-base: &control-plane-svc-base
  build:
    context: .
    dockerfile: ./control-plane-svc/Dockerfile
  # Exits when the database isn't reachable yet (Patroni is still electing a
  # primary) and comes back once it is.
  restart: unless-stopped
  environment:
    ADDRESS:    0.0.0.0
    WEB_PORT:   "8080"
    REST_PORT:  "8081"
    CP_CONFIG: /etc/control-plane/config.json
    CONTROL_PLANE_SECRET: ${CONTROL_PLANE_CLIENT_SECRET:?run start.sh or copy .env.example to .env}
    CENTRAL_CONTROL_PLANE_KEYCLOAK_CLIENT_SECRET: ${CONTROL_PLANE_CENTRAL_KEYCLOAK_CLIENT_SECRET:? run start.sh or copy .env.example to .env}
    DC1_CONTROL_PLANE_KEYCLOAK_CLIENT_SECRET: ${DC1_CONTROL_PLANE_KEYCLOAK_CLIENT_SECRET:?run start.sh or copy .env.example to .env}
    DC2_CONTROL_PLANE_KEYCLOAK_CLIENT_SECRET: ${DC2_CONTROL_PLANE_KEYCLOAK_CLIENT_SECRET:?run start.sh or copy .env.example to .env}
    POSTGRES_HOST: control-plane-db  # control-plane-db-lb, always the primary
    POSTGRES_PORT: 5432
    POSTGRES_USER: control-plane
    POSTGRES_DB: control-plane
    POSTGRES_PASSWORD: ${CONTROL_PLANE_DB_PASSWORD:?run start.sh or copy .env.example to .env}
    POSTGRES_SSL_MODE: disable
    TZ: Europe/Rome
    TIMEZONE: Europe/Rome
  volumes:
    - ./control-plane-svc/config.json:/etc/control-plane/config.json:ro
  networks:
    - edge-net
    - control-plane-net
    - control-plane-db-net  # reaches the database load balancer
  depends_on:
    control-plane-db-lb:
      condition: service_started
    keycloak-central-1:
      condition: service_healthy
    keycloak-central-2:
      condition: service_healthy
    keycloak-dc-1:
      condition: service_healthy
    keycloak-dc-2:
      condition: service_healthy


# Control plane database: two Postgres nodes run by Patroni (shared image in
# patroni-db/), one primary and one hot standby in synchronous replication.
# The leader lock lives in the shared etcd (compose/etcd.yml) under the
# "control-plane" scope.
x-control-plane-db-env: &control-plane-db-env
  PATRONI_SCOPE: control-plane
  PATRONI_SUPERUSER_USERNAME: postgres
  PATRONI_SUPERUSER_PASSWORD: ${CONTROL_PLANE_DB_SUPERUSER_PASSWORD:?run start.sh or copy .env.example to .env}
  PATRONI_REPLICATION_USERNAME: replicator
  PATRONI_REPLICATION_PASSWORD: ${CONTROL_PLANE_DB_REPLICATION_PASSWORD:?run start.sh or copy .env.example to .env}
  # Read by post_bootstrap.sh when the cluster is first created
  APP_DB_USER: control-plane
  APP_DB_NAME: control-plane
  APP_DB_PASSWORD: ${CONTROL_PLANE_DB_PASSWORD:?run start.sh or copy .env.example to .env}
  TZ: Europe/Rome

x-control-plane-db-base: &control-plane-db-base
  build: ./patroni-db
  image: babylon/patroni-db:local  # built once, shared with the Keycloak database
  restart: unless-stopped
  healthcheck:
    # Patroni's /health is 200 while Postgres runs, as primary or replica.
    test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/health', timeout=3)"]
    interval: 15s
    timeout: 15s
    retries: 30
    start_period: 60s
  networks:
    - control-plane-db-net
    - central-etcd-net
  depends_on:
    - control-plane-etcd-1
    - control-plane-etcd-2
    - control-plane-etcd-3

x-control-plane-oauth2-proxy-base: &control-plane-oauth2-proxy-base
  image: quay.io/oauth2-proxy/oauth2-proxy:v7.12.0
  restart: unless-stopped # retries OIDC discovery if the issuer isn't reachable yet
  command:
    - --config=/etc/oauth2-proxy/oauth2-proxy.cfg
  volumes:
    - ./oauth2-proxy/control-plane-oauth2-proxy.cfg:/etc/oauth2-proxy/oauth2-proxy.cfg:ro
  environment:
    OAUTH2_PROXY_CLIENT_SECRET: ${CP_CONSOLE_OIDC_CLIENT_SECRET:?run start.sh or copy .env.example to .env}
    OAUTH2_PROXY_COOKIE_SECRET: ${CP_CONSOLE_COOKIE_SECRET:?run start.sh or copy .env.example to .env}
  networks:
    - edge-net
    - control-plane-net
  depends_on:
    keycloak-control-plane:
      condition: service_healthy

services:
  control-plane-lb:
    image: haproxy:3.2-alpine
    container_name: control-plane-lb
    volumes:
      - ./control-plane-lb/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "127.0.0.1:9080:8080"  # console (operator login) + /api/v1/discover
      - "127.0.0.1:9081:8081"  # REST API
      - "127.0.0.1:8404:8404"  # HAProxy stats
    networks:
      edge-net:
        aliases:
          - control-plane  # nginx and Keycloak's HRD oracle URL point here
      control-plane-net:
        
    depends_on:
      - control-plane-svc-1
      - control-plane-svc-2
      - control-plane-oauth2-proxy-1
      - control-plane-oauth2-proxy-2

  # Operator login: oauth2-proxy as a reverse proxy between control-plane-lb
  # :8080 and :8082. Both instances share the cookie secret, so a session
  # started on one is valid on the other.
  control-plane-oauth2-proxy-1:
    <<: *control-plane-oauth2-proxy-base
    container_name: control-plane-oauth2-proxy-1

  control-plane-oauth2-proxy-2:
    <<: *control-plane-oauth2-proxy-base
    container_name: control-plane-oauth2-proxy-2

  # Operators' identity provider, separate from the central/DC Keycloaks so a
  # B2C or B2B account can never reach the console. auth.control-plane.babylon.test
  keycloak-control-plane:
    image: quay.io/keycloak/keycloak:26.7.0
    container_name: keycloak-control-plane
    command: start-dev --import-realm # lab only; use `start` with HTTPS in production
    restart: unless-stopped
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-control-plane-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${CP_KC_DB_PASSWORD:?run start.sh or copy .env.example to .env}
      KC_HOSTNAME: http://auth.control-plane.babylon.test
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${CP_KC_ADMIN_USERNAME:?run start.sh or copy .env.example to .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${CP_KC_ADMIN_PASSWORD:?run start.sh or copy .env.example to .env}
      # Read by the realm import
      CP_CONSOLE_OIDC_CLIENT_SECRET: ${CP_CONSOLE_OIDC_CLIENT_SECRET:?run start.sh or copy .env.example to .env}
      CP_OPERATOR_PASSWORD: ${CP_OPERATOR_PASSWORD:?run start.sh or copy .env.example to .env}
      TZ: Europe/Rome
    healthcheck:
      # The image has no curl, so talk to the management port through bash.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 15s
      timeout: 15s
      retries: 30
      start_period: 60s
    volumes:
      - ./keycloak/control-plane/import:/opt/keycloak/data/import:ro
    networks:
      - edge-net                       # nginx reaches it as auth.control-plane.babylon.test
      - keycloak-control-plane-db-net
    depends_on:
      keycloak-control-plane-db:
        condition: service_healthy

  keycloak-control-plane-db:
    image: postgres:17
    container_name: keycloak-control-plane-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_DB: keycloak
      POSTGRES_PASSWORD: ${CP_KC_DB_PASSWORD:?run start.sh or copy .env.example to .env}
      TZ: Europe/Rome
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 15s
      timeout: 15s
      retries: 30
      start_period: 60s
    volumes:
      - keycloak-control-plane-db-data:/var/lib/postgresql/data
    networks:
      - keycloak-control-plane-db-net

  control-plane-svc-1:
    <<: *control-plane-svc-base
    container_name: control-plane-svc-1

  control-plane-svc-2:
    <<: *control-plane-svc-base
    container_name: control-plane-svc-2

  
  # Always forwards :5432 to whichever node Patroni says is the primary.
  control-plane-db-lb:
    image: haproxy:3.2-alpine
    container_name: control-plane-db-lb
    volumes:
      - ./control-plane-db-lb/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "5433:5432"            # primary, read-write (lab only; remove with HTTPS)
      - "127.0.0.1:5434:5433"  # replicas, read-only
      - "127.0.0.1:8405:8404"  # HAProxy stats
    networks:
      control-plane-db-net:
        aliases:
          - control-plane-db  # POSTGRES_HOST of the control plane
    depends_on:
      - control-plane-db-1
      - control-plane-db-2

  control-plane-db-1:
    <<: *control-plane-db-base
    container_name: control-plane-db-1
    environment:
      <<: *control-plane-db-env
      PATRONI_NAME: control-plane-db-1
      PATRONI_RESTAPI_CONNECT_ADDRESS: control-plane-db-1:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: control-plane-db-1:5432
    volumes:
      - control-plane-db-1-data:/var/lib/postgresql/data

  control-plane-db-2:
    <<: *control-plane-db-base
    container_name: control-plane-db-2
    environment:
      <<: *control-plane-db-env
      PATRONI_NAME: control-plane-db-2
      PATRONI_RESTAPI_CONNECT_ADDRESS: control-plane-db-2:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: control-plane-db-2:5432
    volumes:
      - control-plane-db-2-data:/var/lib/postgresql/data



networks:
  control-plane-net:
    driver: bridge
  # Control plane database cluster: Patroni nodes and their load balancer.
  control-plane-db-net:
    driver: bridge
  # Operators' Keycloak and its database
  keycloak-control-plane-db-net:
    driver: bridge

volumes:
  control-plane-db-1-data:
  control-plane-db-2-data:
  keycloak-control-plane-db-data: