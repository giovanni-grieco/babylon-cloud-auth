<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sign in</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #12141a;
      color: #e6e8ee;
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .card {
      width: min(360px, calc(100vw - 2rem));
      padding: 2rem;
      background: #1b1e27;
      border: 1px solid #2b3040;
      border-radius: 12px;
      box-shadow: 0 12px 32px rgb(0 0 0 / 35%);
    }
    h1 { margin: 0 0 .25rem; font-size: 1.35rem; }
    p.sub { margin: 0 0 1.5rem; color: #9aa3b5; font-size: .875rem; }
    label { display: block; margin-bottom: .35rem; font-size: .8rem; color: #9aa3b5; }
    input[type=text], input[type=password] {
      width: 100%;
      padding: .65rem .75rem;
      margin-bottom: 1rem;
      background: #12141a;
      border: 1px solid #2b3040;
      border-radius: 8px;
      color: inherit;
      font: inherit;
    }
    input:focus { outline: 2px solid #4f7cff; outline-offset: 1px; border-color: transparent; }
    button {
      width: 100%;
      padding: .7rem;
      border: 0;
      border-radius: 8px;
      background: #4f7cff;
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #3f68e0; }
    .error {
      margin: 0 0 1rem;
      padding: .6rem .75rem;
      background: #3a1b22;
      border: 1px solid #6b2635;
      border-radius: 8px;
      color: #ffb3bf;
      font-size: .875rem;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Sign in</h1>
    <p class="sub">Your session is missing or has expired.</p>

    {{ if .Error }}<p class="error">{{ .Error }}</p>{{ end }}

    <form method="post" action="/login">
      <input type="hidden" name="state" value="{{ .State }}">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Log in</button>
    </form>
  </main>
</body>
</html>
