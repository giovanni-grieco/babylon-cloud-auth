<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in</title>
</head>
<body>
  <main>
    <h1>Login Form</h1>
    <p>Try admin-admin ;p</p>
    {{ if .Error }}<p class="error">{{ .Error }}</p>{{ end }}
    <form method="post" action="{{ .ReturnUrl }}">
      <input type="hidden" name="state" value="{{ .State }}">
      <div class="field">
        {{ if .Username }}
          <p>Signing in as <strong>{{ .Username }}</strong>
             (<a href="/login?state={{ .State }}">not you?</a>)</p>
          <input type="hidden" name="username" value="{{ .Username }}">
        {{ else }}
          <label for="username">Username</label>
          <input id="username" name="username" type="text" autocomplete="username" required autofocus>
        {{ end }}
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required{{ if .Username }} autofocus{{ end }}>
      </div>

      <button type="submit">Log in</button>
    </form>
  </main>
</body>
</html>
